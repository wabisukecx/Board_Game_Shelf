name: bg_shelf_scanner
description: Board game collection manager for BGG search, local records, and analyzer-compatible YAML export.
publish_to: none
version: 0.1.2+3

environment:
  sdk: ^3.11.0

dependencies:
  crypto: ^3.0.7
  csv: ^8.0.0
  dio: ^5.9.0
  drift: ^2.30.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^10.0.0-beta.4
  image: ^4.8.0
  image_picker: ^1.2.2
  mobile_scanner: ^7.2.0
  path: ^1.9.1
  path_provider: ^2.1.5
  share_plus: ^10.1.4
  shared_preferences: ^2.5.5
  sqlite3: ^2.9.4
  sqlite3_flutter_libs: ^0.5.40
  xml: ^6.6.1
  yaml: ^3.1.3

dev_dependencies:
  build_runner: ^2.10.4
  drift_dev: ^2.30.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/
    - assets/analysis/
    - assets/gameupc/
